{% extends "components/base.html" %}

{% block title %}Regístrate{% endblock %}

{% block body %}
<div class="min-h-screen pt-24 pb-12 px-3 bg-gradient-to-r from-gray-100 via-gray-200 to-gray-100">
  <div class="max-w-xl mx-auto">
    <div class="bg-white/80 backdrop-blur rounded-2xl shadow-lg border border-slate-200 p-6 text-center">
      <div class="flex items-center justify-center mb-3">
        <svg class="w-10 h-10 text-slate-900" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
        </svg>
      </div>
      <h4 class="text-2xl font-bold text-slate-800">Acción realizada con éxito</h4>

      <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
        <a href="{% url 'auth_login' %}"
           class="inline-flex items-center justify-center rounded-full bg-slate-900 text-white px-6 py-2 font-medium hover:bg-slate-700 shadow">
          Iniciar sesión
        </a>
        <a href="{{ previous_url }}"
           class="inline-flex items-center justify-center rounded-full bg-white text-slate-900 px-6 py-2 font-medium border border-slate-200 hover:bg-slate-50 shadow">
          Regresar
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
